services:
  dev-tools:
    image: bootoolz/docker-toolchain-full:v0.2
    container_name: imgui
    env_file:
      - env_file
    volumes:
      - ./:/home/dev/workspace
      - ./entrypoint.sh:/home/dev/entrypoint.sh
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    tty: true
    stdin_open: true
    privileged: true
    entrypoint: ["bash", "/home/dev/entrypoint.sh"]